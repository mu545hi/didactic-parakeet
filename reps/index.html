
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1c1c1e;
      color: #f2f2f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
    }

    /* ── Auth ── */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; margin-top: 80px;
    }
    #auth-screen h1 { font-size: 28px; }
    #auth-screen p  { color: #8e8e93; font-size: 14px; text-align: center; max-width: 300px; }

    /* ── Cycle picker ── */
    #cycle-screen {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; padding: 40px 20px; width: 100%; max-width: 400px;
    }
    #cycle-screen h2 { font-size: 22px; }
    .cycle-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: #2c2c2e; color: #f2f2f7; font-size: 19px; font-weight: 600;
      cursor: pointer; text-align: left;
    }
    .cycle-btn:active { opacity: 0.7; }
    .cycle-btn .cycle-sub { font-size: 14px; color: #8e8e93; font-weight: 400; margin-top: 3px; }

    /* ── Workout screen ── */
    #workout-screen {
      display: none; flex-direction: column; align-items: center;
      width: 100%; height: 100%; padding: 12px 0 0;
    }

    #workout-header {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 0 16px 10px;
    }
    #workout-header h2 { font-size: 20px; }
    #workout-header .header-right { display: flex; gap: 8px; align-items: center; }
    #progress-label { font-size: 13px; color: #8e8e93; }

    /* ── Card stack area ── */
    #card-area {
      position: relative;
      width: calc(100% - 32px);
      max-width: 420px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card ── */
    .card {
      position: absolute;
      width: 100%;
      height: 90%;
      max-height: 560px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    /* stacked shadow cards */
    .card:nth-child(2) { transform: translateY(8px) scale(0.97); z-index: 1; }
    .card:nth-child(3) { transform: translateY(16px) scale(0.94); z-index: 0; }
    .card:nth-child(n+4) { display: none; }

    .card.top { z-index: 10; transform: none; }

    /* flip container */
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
      border-radius: 20px;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0; border-radius: 20px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* ── Front face ── */
    .card-front {
      background: #2c2c2e;
      display: flex; flex-direction: column;
      padding: 24px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card-front.completed { background: #1a3a1a; }

    .card-name {
      font-size: 26px; font-weight: 700; line-height: 1.3;
      margin-bottom: 8px;
    }
    .card-meta { font-size: 15px; color: #8e8e93; margin-bottom: 16px; }

    .card-last {
      flex: 1;
      font-size: 17px; color: #aeaeb2; line-height: 2;
    }
    .card-last .last-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #636366; margin-bottom: 4px;
    }

    .card-status {
      margin-top: 12px; font-size: 13px; color: #30d158; font-weight: 600;
    }

    .flip-hint {
      margin-top: auto; font-size: 11px; color: #48484a; text-align: center;
    }

    /* ── Back face ── */
    .card-back {
      background: #2c2c2e;
      transform: rotateY(180deg);
      display: flex; flex-direction: column;
      padding: 16px;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow-y: auto;
    }

    .back-title {
      font-size: 18px; font-weight: 700; flex-shrink: 0;
    }

    /* ── Strength rows ── */
    .rows-container { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }

    .exercise-row {
      background: #3a3a3c; border-radius: 12px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .row-top {
      display: flex; align-items: center; gap: 8px;
    }
    .note-input {
      flex: 1; background: #1c1c1e; color: #f2f2f7;
      border: 1px solid #48484a; border-radius: 8px;
      padding: 8px 12px; font-size: 17px;
    }
    .note-input:focus { outline: none; border-color: #0a84ff; }
    .del-row-btn {
      background: #48484a; border: none; color: #ff453a;
      border-radius: 8px; width: 34px; height: 34px;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .sets-row {
      display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap;
    }

    .set-col {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .set-btn {
      background: #48484a; border: none; color: #f2f2f7;
      border-radius: 8px; width: 40px; height: 32px;
      font-size: 16px; cursor: pointer; line-height: 1;
    }
    .set-btn:active { opacity: 0.6; }
    .set-val {
      font-size: 26px; font-weight: 700; min-width: 40px; text-align: center;
      color: #f2f2f7;
    }
    .del-set-btn {
      background: none; border: none; color: #48484a;
      font-size: 13px; cursor: pointer; padding: 0;
    }
    .del-set-btn:active { color: #ff453a; }

    .add-set-btn {
      background: #48484a; border: none; color: #0a84ff;
      border-radius: 8px; padding: 6px 12px; font-size: 15px;
      cursor: pointer; align-self: flex-end;
    }

    .add-row-btn {
      background: none; border: 1px dashed #48484a; color: #8e8e93;
      border-radius: 10px; padding: 10px; font-size: 14px;
      cursor: pointer; text-align: center; flex-shrink: 0;
    }
    .add-row-btn:active { border-color: #0a84ff; color: #0a84ff; }

    /* ── Circuit card back ── */
    .circuit-container { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }

    .circuit-rounds {
      text-align: center; font-size: 13px; color: #8e8e93; flex-shrink: 0;
    }
    .circuit-rounds span { font-size: 28px; font-weight: 700; color: #f2f2f7; display: block; }

    .circuit-item {
      background: #3a3a3c; border-radius: 12px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .circuit-item-name { flex: 1; font-size: 14px; line-height: 1.4; }
    .circuit-counter {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .circuit-val { font-size: 22px; font-weight: 700; min-width: 36px; text-align: center; }
    .circuit-btns { display: flex; gap: 4px; }

    /* ── Submit ── */
    .submit-btn {
      background: #30d158; border: none; color: #000;
      border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700;
      cursor: pointer; flex-shrink: 0; width: 100%;
    }
    .submit-btn:active { opacity: 0.8; }

    /* ── Completed pile ── */
    #completed-section {
      width: calc(100% - 32px); max-width: 420px;
      padding: 8px 0 12px; flex-shrink: 0;
    }
    #completed-label {
      font-size: 12px; color: #48484a; text-align: center; margin-bottom: 4px;
    }
    #completed-chips {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    .completed-chip {
      background: #1a3a1a; color: #30d158; border-radius: 8px;
      padding: 4px 10px; font-size: 12px; font-weight: 600;
    }

    /* ── Swipe out ── */
    .card.swipe-out {
      transition: transform 0.35s ease, opacity 0.35s ease;
      transform: translateX(160%) rotate(15deg) !important;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Shared btn ── */
    .btn {
      padding: 12px 24px; border-radius: 12px; border: none;
      background: #0a84ff; color: white; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .btn:active { opacity: 0.8; }
    .btn.ghost { background: #2c2c2e; color: #8e8e93; }

    #loading { color: #8e8e93; font-size: 15px; margin-top: 60px; }
    #done-msg { font-size: 22px; color: #30d158; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <h1>💪 Reps</h1>
  <p>Sign in with Google to load your workout data.</p>
  <button class="btn" onclick="connectGoogle()">Connect with Google</button>
  <a href="../index.html" style="color:#48484a;font-size:13px;margin-top:8px">← Back</a>
</div>

<!-- Loading -->
<div id="loading" style="display:none">Loading…</div>

<!-- Cycle picker -->
<div id="cycle-screen"></div>

<!-- Workout -->
<div id="workout-screen">
  <div id="workout-header">
    <div>
      <h2 id="cycle-title"></h2>
      <div id="session-label" style="font-size:12px;color:#8e8e93;margin-top:2px"></div>
    </div>
    <div class="header-right">
      <span id="progress-label"></span>
      <button class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="showCyclePicker()">↩</button>
    </div>
  </div>

  <div id="card-area"></div>

  <div id="completed-section" style="display:none">
    <div id="completed-label">Completed</div>
    <div id="completed-chips"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────────────────────────
const CLIENT_ID  = "849477607564-p3jib8rsfvlv2fgsif1avafrjo4qac5k.apps.googleusercontent.com";
const SHEET_ID   = "1JuWrIRP1aLT-clyunBYi4JXGoApalDRt5SrQRXSYywg";
const LOG_RANGE  = "RepsLog";
const CYCLE_RANGE = "RepsCycle";

// Column indices for RepsLog (0-based)
const LC = { exercise: 0, muscleGroups: 1, cycleType: 2, history: 3 };

// Static cycle rotation — order defines the progression.
// Each PM session advances to the next; AM = Recovery of the same muscle group.
// "Rest" has no sheet exercises — it's a terminal state that resets to index 0.
const CYCLES = [
  { id: "PullStrength",     label: "Pull — Strength",     sub: "Back · Biceps · Rear delts",      ampm: "PM" },
  { id: "PullRecovery",     label: "Pull — Recovery",     sub: "Circuit · Low intensity",          ampm: "AM" },
  { id: "LegsStrength",     label: "Legs — Strength",     sub: "Quads · Hamstrings · Glutes",      ampm: "PM" },
  { id: "LegsRecovery",     label: "Legs — Recovery",     sub: "Circuit · Low intensity",          ampm: "AM" },
  { id: "PushStrength",     label: "Push — Strength",     sub: "Chest · Shoulders · Triceps",      ampm: "PM" },
  { id: "PushRecovery",     label: "Push — Recovery",     sub: "Circuit · Low intensity",          ampm: "AM" },
  { id: "CoreStrength",     label: "Core — Strength",     sub: "Abs · Stability",                  ampm: "PM" },
  { id: "CoreRecovery",     label: "Core — Recovery",     sub: "Circuit · Low intensity",          ampm: "AM" },
  { id: "Cardio",           label: "Cardio",              sub: "Conditioning",                     ampm: "PM" },
  { id: "CardioRecovery",   label: "Cardio — Recovery",   sub: "Light conditioning",               ampm: "AM" },
  { id: "Mobility",         label: "Mobility / Yoga",     sub: "Flexibility · Recovery",           ampm: "PM" },
  { id: "MobilityRecovery", label: "Mobility — Recovery", sub: "Light stretching",                 ampm: "AM" },
  { id: "Rest",             label: "Rest",                sub: "No workout today",                 ampm: null },
];

const LS_LAST_CYCLE = "reps_last_cycle_idx"; // kept for manual override only

function setLastCycleIdx(idx) {
  localStorage.setItem(LS_LAST_CYCLE, idx);
}

// Derive next cycle index from RepsCycle sheet data.
// Falls back to localStorage, then 0.
function nextCycleIdxFromHistory(cycleRows) {
  // cycleRows: all rows from RepsCycle (including header)
  // Find the last row that has a CycleType matching our rotation
  if (cycleRows.length > 1) {
    // walk backwards through data rows
    for (let i = cycleRows.length - 1; i >= 1; i--) {
      const ct = cycleRows[i][2] || ""; // col C = CycleType
      const idx = CYCLES.findIndex(c => c.id === ct);
      if (idx >= 0) {
        return (idx + 1) % CYCLES.length;
      }
    }
  }
  // fall back to localStorage
  const v = localStorage.getItem(LS_LAST_CYCLE);
  return v !== null ? (parseInt(v) + 1) % CYCLES.length : 0;
}

let suggestedCycleIdx = 0; // set during boot

// ─────────────────────────────────────────────────────────────────────────────
// Auth
// ─────────────────────────────────────────────────────────────────────────────
let accessToken = null;

function connectGoogle() {
  const redirect = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirect,
    response_type: "token",
    scope: "https://www.googleapis.com/auth/spreadsheets",
  });
  window.location = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function handleAuth() {
  // Accept token passed from home screen via hash
  const hash = window.location.hash;
  if (hash.includes("access_token")) {
    const p = new URLSearchParams(hash.substring(1));
    accessToken = decodeURIComponent(p.get("access_token"));
    window.location.hash = "";
    return true;
  }
  return false;
}

// ─────────────────────────────────────────────────────────────────────────────
// Sheets API
// ─────────────────────────────────────────────────────────────────────────────
async function fetchRange(range) {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const data = await res.json();
  return data.values || [];
}

async function putCell(range, value) {
  await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
    {
      method: "PUT",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ range, values: [[value]] }),
    }
  );
}

async function appendRow(range, rowValues) {
  await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,
    {
      method: "POST",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ values: [rowValues] }),
    }
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// History parsing
// ─────────────────────────────────────────────────────────────────────────────
// Format: "YYYY-MM-DD AM/PM — 25: 8,8,10+ ; 30: 5"
// Returns array of { note, sets: [{ val, fail }] }
function parseLastEntry(history) {
  if (!history || !history.trim()) return null;
  const lines = history.trim().split("\n");
  const last = lines[lines.length - 1];
  // strip date/time prefix
  const body = last.replace(/^\d{4}-\d{2}-\d{2}\s+[AP]M\s+—\s+/, "").trim();
  if (!body) return null;

  // circuit: just a number like "10 rounds"
  const circuitMatch = body.match(/^(\d+)\s*rounds?$/i);
  if (circuitMatch) return { circuit: true, rounds: parseInt(circuitMatch[1]) };

  // strength: blocks separated by " ; "
  const blocks = body.split(/\s*;\s*/);
  return blocks.map(block => {
    const colonIdx = block.indexOf(":");
    const note = colonIdx >= 0 ? block.slice(0, colonIdx).trim() : "";
    const setsPart = colonIdx >= 0 ? block.slice(colonIdx + 1).trim() : block.trim();
    const sets = setsPart.split(",").map(s => {
      s = s.trim();
      const fail = s.endsWith("+");
      const val = parseInt(s) || 0;
      return { val, fail };
    });
    return { note, sets };
  });
}

function formatEntry(rows) {
  // rows: [{ note, sets: [{val, fail}] }]
  return rows.map(r => {
    const setsStr = r.sets.map(s => s.val + (s.fail ? "+" : "")).join(",");
    return r.note ? `${r.note}: ${setsStr}` : setsStr;
  }).join(" ; ");
}

function todayStamp(ampm) {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm   = String(d.getMonth() + 1).padStart(2, "0");
  const dd   = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd} ${ampm} — `;
}

// ─────────────────────────────────────────────────────────────────────────────
// Data
// ─────────────────────────────────────────────────────────────────────────────
let exercises = [];   // { sheetRow, name, muscleGroups, cycleType, history, isCircuit, lastEntry }
let rawRows   = [];

async function loadExercises() {
  show("loading");
  const rows = await fetchRange(LOG_RANGE);
  rawRows = rows;
  exercises = [];
  // rows[0] = header
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const name         = row[LC.exercise]     || "";
    const muscleGroups = row[LC.muscleGroups] || "";
    const cycleType    = row[LC.cycleType]    || "";
    const history      = row[LC.history]      || "";
    if (!name) continue;
    const isCircuit = name.includes("\n");
    const lastEntry = parseLastEntry(history);
    exercises.push({ sheetRow: i + 1, name, muscleGroups, cycleType, history, isCircuit, lastEntry });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Cycle picker
// ─────────────────────────────────────────────────────────────────────────────
function showCyclePicker() {
  show("cycle-screen");
  const el = document.getElementById("cycle-screen");
  el.innerHTML = "";

  const suggested = suggestedCycleIdx;

  // ── Header ──
  const h = document.createElement("h2");
  h.style.cssText = "margin-bottom:12px";
  h.textContent = "Choose Workout";
  el.appendChild(h);

  // ── Suggested ──
  const sugLabel = document.createElement("div");
  sugLabel.style.cssText = "font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#636366;margin-bottom:6px";
  sugLabel.textContent = "Up next";
  el.appendChild(sugLabel);

  const sug = CYCLES[suggested];
  const sugBtn = makeCycleBtn(sug, suggested, true);
  el.appendChild(sugBtn);

  // ── Divider ──
  const div = document.createElement("div");
  div.style.cssText = "width:100%;border-top:1px solid #3a3a3c;margin:10px 0 6px";
  el.appendChild(div);

  const allLabel = document.createElement("div");
  allLabel.style.cssText = "font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#636366;margin-bottom:6px";
  allLabel.textContent = "All cycles";
  el.appendChild(allLabel);

  // ── Full list ──
  CYCLES.forEach((c, i) => {
    if (i === suggested) return; // already shown above
    el.appendChild(makeCycleBtn(c, i, false));
  });
}

function makeCycleBtn(c, idx, highlight) {
  const count = exercises.filter(e => e.cycleType === c.id).length;
  const btn = document.createElement("button");
  btn.className = "cycle-btn";
  if (highlight) btn.style.cssText = "border:2px solid #0a84ff;background:#1a2a3a";

  const ampmTag = c.ampm ? `<span style="font-size:11px;color:#8e8e93;font-weight:400;margin-left:6px">${c.ampm}</span>` : "";
  const countTag = count > 0
    ? `<span style="color:#8e8e93;font-size:13px;font-weight:400"> (${count})</span>`
    : `<span style="color:#48484a;font-size:13px;font-weight:400"> —</span>`;

  btn.innerHTML = `${c.label}${ampmTag}${countTag}
    <div class="cycle-sub">${c.sub}</div>`;

  if (c.id === "Rest") {
    btn.onclick = () => {
      suggestedCycleIdx = (idx + 1) % CYCLES.length;
      setLastCycleIdx(idx);
      showCyclePicker();
    };
  } else {
    btn.onclick = () => startWorkout(c.id, c.label, idx);
  }
  return btn;
}

// ─────────────────────────────────────────────────────────────────────────────
// Workout state
// ─────────────────────────────────────────────────────────────────────────────
let deck       = [];   // exercise objects for current cycle, shuffled
let completed  = [];   // completed exercise names
let sessionAMPM = "PM";

function startWorkout(cycleId, cycleLabel, cycleIdx) {
  deck = exercises
    .filter(e => e.cycleType === cycleId)
    .map(e => ({ ...e }));
  // shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  completed = [];
  // use the cycle's canonical AM/PM; fall back to clock
  const cycleDef = CYCLES[cycleIdx];
  sessionAMPM = cycleDef?.ampm ?? (new Date().getHours() < 13 ? "AM" : "PM");
  // advance the rotation pointer when this workout is started
  suggestedCycleIdx = (cycleIdx + 1) % CYCLES.length;
  setLastCycleIdx(cycleIdx);

  document.getElementById("cycle-title").textContent = cycleLabel;
  document.getElementById("session-label").textContent =
    `${sessionAMPM} · ${new Date().toLocaleDateString()}`;

  show("workout-screen");
  renderDeck();
}

// ─────────────────────────────────────────────────────────────────────────────
// Card rendering
// ─────────────────────────────────────────────────────────────────────────────
function renderDeck() {
  const area = document.getElementById("card-area");
  area.innerHTML = "";

  if (deck.length === 0) {
    area.innerHTML = `<div id="done-msg">All done! 🎉<br><br>
      <button class="btn" onclick="showCyclePicker()">New Workout</button></div>`;
    updateProgress();
    return;
  }

  // render top 3 for stack effect (back to front)
  const visible = deck.slice(0, 3).reverse();
  visible.forEach((ex, i) => {
    const isTop = i === visible.length - 1;
    const card = buildCard(ex, isTop);
    area.appendChild(card);
  });

  updateProgress();
}

function buildCard(ex, isTop) {
  const card = document.createElement("div");
  card.className = "card" + (isTop ? " top" : "");
  card.dataset.name = ex.name;

  const inner = document.createElement("div");
  inner.className = "card-inner";

  inner.appendChild(buildFront(ex));
  inner.appendChild(buildBack(ex));
  card.appendChild(inner);

  if (isTop) {
    attachCardInteraction(card, ex);
  }

  return card;
}

function buildFront(ex) {
  const face = document.createElement("div");
  face.className = "card-face card-front";

  const displayName = ex.name.split("\n")[0]; // first line for circuits
  const isCircuit = ex.isCircuit;

  let lastHtml = "";
  if (ex.lastEntry && !isCircuit) {
    const rows = ex.lastEntry;
    if (Array.isArray(rows)) {
      lastHtml = rows.map(r => {
        const setsStr = r.sets.map(s => s.val + (s.fail ? "+" : "")).join(", ");
        return (r.note ? `<strong>${esc(r.note)}</strong>  ` : "") + esc(setsStr);
      }).join("<br>");
    }
  } else if (isCircuit && ex.lastEntry?.circuit) {
    lastHtml = `${ex.lastEntry.rounds} rounds`;
  }

  face.innerHTML = `
    <div class="card-name">${esc(displayName)}</div>
    <div class="card-meta">${esc(ex.muscleGroups)}${isCircuit ? " · circuit" : ""}</div>
    ${lastHtml ? `<div class="card-last"><div class="last-label">Last time</div>${lastHtml}</div>` : ""}
    <div class="flip-hint">Tap to open · Swipe to shuffle</div>`;
  return face;
}

function buildBack(ex) {
  const face = document.createElement("div");
  face.className = "card-face card-back";

  const displayName = ex.name.split("\n")[0];
  face.innerHTML = `<div class="back-title">${esc(displayName)}</div>`;

  if (ex.isCircuit) {
    face.appendChild(buildCircuitControls(ex));
  } else {
    face.appendChild(buildStrengthControls(ex));
  }

  const submitBtn = document.createElement("button");
  submitBtn.className = "submit-btn";
  submitBtn.textContent = "✓ Log & Complete";
  submitBtn.onclick = (e) => { e.stopPropagation(); submitCard(ex, face.closest(".card")); };
  face.appendChild(submitBtn);

  return face;
}

// ── Strength controls ─────────────────────────────────────────────────────────
function buildStrengthControls(ex) {
  const container = document.createElement("div");
  container.className = "rows-container";

  // seed from last entry or default 3×0
  let seedRows = [{ note: "", sets: [{ val: 0, fail: false }, { val: 0, fail: false }, { val: 0, fail: false }] }];
  if (ex.lastEntry && Array.isArray(ex.lastEntry)) {
    seedRows = ex.lastEntry.map(r => ({
      note: r.note,
      sets: r.sets.map(s => ({ val: s.val, fail: false })), // reset fail flag
    }));
  }

  // store mutable state on the container
  container._rows = seedRows.map(r => ({ note: r.note, sets: [...r.sets] }));

  function rerender() {
    container.innerHTML = "";
    container._rows.forEach((row, ri) => {
      const rowEl = document.createElement("div");
      rowEl.className = "exercise-row";

      // top: note input + delete row
      const rowTop = document.createElement("div");
      rowTop.className = "row-top";

      const noteInput = document.createElement("input");
      noteInput.type = "text";
      noteInput.className = "note-input";
      noteInput.placeholder = "weight / note";
      noteInput.value = row.note;
      noteInput.addEventListener("input", e => { container._rows[ri].note = e.target.value; });
      rowTop.appendChild(noteInput);

      if (container._rows.length > 1) {
        const delRow = document.createElement("button");
        delRow.className = "del-row-btn";
        delRow.textContent = "×";
        delRow.onclick = (e) => { e.stopPropagation(); container._rows.splice(ri, 1); rerender(); };
        rowTop.appendChild(delRow);
      }
      rowEl.appendChild(rowTop);

      // sets
      const setsRow = document.createElement("div");
      setsRow.className = "sets-row";

      row.sets.forEach((set, si) => {
        const col = document.createElement("div");
        col.className = "set-col";

        const incBtn = document.createElement("button");
        incBtn.className = "set-btn";
        incBtn.textContent = "▲";
        incBtn.onclick = (e) => { e.stopPropagation(); container._rows[ri].sets[si].val++; rerender(); };

        const valEl = document.createElement("div");
        valEl.className = "set-val";
        valEl.textContent = set.val;

        const decBtn = document.createElement("button");
        decBtn.className = "set-btn";
        decBtn.textContent = "▼";
        decBtn.onclick = (e) => { e.stopPropagation(); if (container._rows[ri].sets[si].val > 0) { container._rows[ri].sets[si].val--; rerender(); } };

        const delSet = document.createElement("button");
        delSet.className = "del-set-btn";
        delSet.textContent = "✕";
        delSet.onclick = (e) => { e.stopPropagation(); container._rows[ri].sets.splice(si, 1); rerender(); };

        col.appendChild(incBtn);
        col.appendChild(valEl);
        col.appendChild(decBtn);
        col.appendChild(delSet);
        setsRow.appendChild(col);
      });

      // add set button
      const addSet = document.createElement("button");
      addSet.className = "add-set-btn";
      addSet.textContent = "+ set";
      addSet.onclick = (e) => { e.stopPropagation(); container._rows[ri].sets.push({ val: 0, fail: false }); rerender(); };
      setsRow.appendChild(addSet);

      rowEl.appendChild(setsRow);
      container.appendChild(rowEl);
    });

    // add row button
    const addRow = document.createElement("button");
    addRow.className = "add-row-btn";
    addRow.textContent = "+ add weight row";
    addRow.onclick = (e) => { e.stopPropagation(); container._rows.push({ note: "", sets: [{ val: 0, fail: false }] }); rerender(); };
    container.appendChild(addRow);
  }

  rerender();
  return container;
}

// ── Circuit controls ──────────────────────────────────────────────────────────
function buildCircuitControls(ex) {
  const container = document.createElement("div");
  container.className = "circuit-container";

  // rounds counter
  const roundsEl = document.createElement("div");
  roundsEl.className = "circuit-rounds";
  roundsEl.innerHTML = `<span id="circuit-rounds-val">0</span>rounds completed`;

  const roundBtns = document.createElement("div");
  roundBtns.style.cssText = "display:flex;gap:8px;justify-content:center;margin-bottom:4px";

  let rounds = 0;
  function updateRounds() { document.getElementById("circuit-rounds-val").textContent = rounds; }

  const decR = document.createElement("button");
  decR.className = "set-btn";
  decR.style.cssText = "width:40px;height:36px;font-size:18px";
  decR.textContent = "▼";
  decR.onclick = (e) => { e.stopPropagation(); if (rounds > 0) { rounds--; updateRounds(); } };

  const incR = document.createElement("button");
  incR.className = "set-btn";
  incR.style.cssText = "width:40px;height:36px;font-size:18px";
  incR.textContent = "▲";
  incR.onclick = (e) => { e.stopPropagation(); rounds++; updateRounds(); };

  roundBtns.appendChild(decR);
  roundBtns.appendChild(incR);
  container.appendChild(roundsEl);
  container.appendChild(roundBtns);

  // circuit exercises list
  const lines = ex.name.split("\n").filter(l => l.trim());
  lines.forEach(line => {
    const item = document.createElement("div");
    item.className = "circuit-item";

    const nameEl = document.createElement("div");
    nameEl.className = "circuit-item-name";
    nameEl.textContent = line.trim();

    item.appendChild(nameEl);
    container.appendChild(item);
  });

  // store rounds ref for submit
  container._getRounds = () => rounds;
  return container;
}

// ─────────────────────────────────────────────────────────────────────────────
// Card interaction (swipe to shuffle, tap front to flip open)
// ─────────────────────────────────────────────────────────────────────────────
function attachCardInteraction(card, ex) {
  let startX = 0, startY = 0, tracking = false, lastTap = 0;
  let swipeHandled = false; // suppress click after a swipe

  function isInteractive(el) {
    return el.closest("button, input, textarea, select") !== null;
  }

  // Tap / double-tap lives on click so it fires once per gesture on iOS PWA
  card.addEventListener("click", e => {
    if (isInteractive(e.target)) return;
    if (swipeHandled) { swipeHandled = false; return; }
    const now = Date.now();
    if (now - lastTap < 300) {
      lastTap = 0;
      shuffleToBack();
    } else {
      lastTap = now;
      card.classList.toggle("flipped");
    }
  });

  card.addEventListener("touchstart", e => {
    if (isInteractive(e.target)) { tracking = false; return; }
    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;
    tracking = true;
    swipeHandled = false;
  }, { passive: true });

  card.addEventListener("touchmove", e => {
    if (tracking) e.preventDefault();
  }, { passive: false });

  card.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      swipeHandled = true; // block the subsequent click
      shuffleToBack();
    }
    // taps fall through to the click handler
  });

  card.addEventListener("mousedown", e => {
    if (isInteractive(e.target)) { tracking = false; return; }
    startX = e.clientX; startY = e.clientY;
    tracking = true;
    swipeHandled = false;
  });

  card.addEventListener("mouseup", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      swipeHandled = true;
      shuffleToBack();
    }
    // taps fall through to the click handler
  });
}

function shuffleToBack() {
  if (deck.length <= 1) return;
  const top = deck.shift();
  deck.push(top);
  renderDeck();
}

// ─────────────────────────────────────────────────────────────────────────────
// Submit
// ─────────────────────────────────────────────────────────────────────────────
async function submitCard(ex, cardEl) {
  // collect entry string
  let entryBody = "";
  const back = cardEl.querySelector(".card-back");

  if (ex.isCircuit) {
    const circuitContainer = back.querySelector(".circuit-container");
    const rounds = circuitContainer?._getRounds() ?? 0;
    entryBody = `${rounds} rounds`;
  } else {
    const rowsContainer = back.querySelector(".rows-container");
    if (rowsContainer?._rows) {
      entryBody = formatEntry(rowsContainer._rows);
    }
  }

  const stamp = todayStamp(sessionAMPM);
  const newLine = stamp + entryBody;
  const newHistory = ex.history ? ex.history + "\n" + newLine : newLine;

  // animate out
  cardEl.classList.add("swipe-out");
  cardEl.addEventListener("transitionend", () => {
    deck.shift();
    completed.push(ex.name.split("\n")[0]);
    renderDeck();
    renderCompleted();
  }, { once: true });

  // write to sheet
  const cellRange = `${LOG_RANGE}!D${ex.sheetRow}`;
  await putCell(cellRange, newHistory);

  // log cycle entry — store the cycle id so boot can read it back
  const cycleId = CYCLES.find(c => c.label === document.getElementById("cycle-title").textContent)?.id
                  || document.getElementById("cycle-title").textContent;
  await appendRow(CYCLE_RANGE, [
    new Date().toISOString().slice(0, 10),
    sessionAMPM,
    cycleId,
    ex.name.split("\n")[0],
  ]);
}

function renderCompleted() {
  const section = document.getElementById("completed-section");
  const chips   = document.getElementById("completed-chips");
  if (completed.length === 0) { section.style.display = "none"; return; }
  section.style.display = "";
  chips.innerHTML = completed.map(n => `<div class="completed-chip">${esc(n)}</div>`).join("");
}

function updateProgress() {
  const total = deck.length + completed.length;
  document.getElementById("progress-label").textContent =
    total > 0 ? `${completed.length}/${total}` : "";
}

// ─────────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────────
function show(id) {
  ["auth-screen", "loading", "cycle-screen", "workout-screen"].forEach(s => {
    const el = document.getElementById(s);
    if (el) el.style.display = s === id ? (s === "workout-screen" || s === "cycle-screen" ? "flex" : "") : "none";
  });
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\n/g, "<br>");
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
async function boot() {
  const authed = handleAuth();
  if (!authed) { show("auth-screen"); return; }
  const [, cycleRows] = await Promise.all([loadExercises(), fetchRange(CYCLE_RANGE)]);
  suggestedCycleIdx = nextCycleIdxFromHistory(cycleRows);
  showCyclePicker();
}

boot();
</script>
