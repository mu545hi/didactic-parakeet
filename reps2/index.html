<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reps2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1c1c1e;
      color: #f2f2f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
    }

    /* ── Auth ── */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; margin-top: 80px;
    }
    #auth-screen h1 { font-size: 28px; }
    #auth-screen p  { color: #8e8e93; font-size: 14px; text-align: center; max-width: 300px; }

    /* ── Cycle picker ── */
    #cycle-screen {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; padding: 40px 20px; width: 100%; max-width: 400px;
      overflow-y: auto; height: 100%;
    }
    #cycle-screen h2 { font-size: 22px; }
    .cycle-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: #2c2c2e; color: #f2f2f7; font-size: 19px; font-weight: 600;
      cursor: pointer; text-align: left;
    }
    .cycle-btn:active { opacity: 0.7; }
    .cycle-btn .cycle-sub { font-size: 14px; color: #8e8e93; font-weight: 400; margin-top: 3px; }

    /* ── Workout screen ── */
    #workout-screen {
      display: none; flex-direction: column; align-items: center;
      width: 100%; height: 100%; padding: 12px 0 0;
    }
    #workout-header {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 0 16px 10px;
    }
    #workout-header h2 { font-size: 20px; }
    #workout-header .header-right { display: flex; gap: 8px; align-items: center; }
    #progress-label { font-size: 13px; color: #8e8e93; }

    /* ── Card area ── */
    #card-area {
      position: relative;
      width: calc(100% - 32px);
      max-width: 420px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card ── */
    .card {
      position: absolute;
      width: 100%;
      height: 90%;
      max-height: 620px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }
    .card:nth-child(2) { transform: translateY(8px) scale(0.97); z-index: 1; }
    .card:nth-child(3) { transform: translateY(16px) scale(0.94); z-index: 0; }
    .card:nth-child(n+4) { display: none; }
    .card.top { z-index: 10; transform: none; }

    .card-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
      border-radius: 20px;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0; border-radius: 20px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* ── Card front ── */
    .card-front {
      background: #2c2c2e;
      display: flex; flex-direction: column;
      padding: 24px 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card-front.done-today { background: #1a3a1a; }

    .card-name { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .card-meta { font-size: 15px; color: #8e8e93; margin-bottom: 16px; }
    .card-ladder {
      flex: 1;
      font-size: 14px; color: #aeaeb2; line-height: 1.9;
    }
    .card-ladder .ladder-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #636366; margin-bottom: 6px;
    }
    .ladder-item { display: flex; gap: 8px; align-items: baseline; }
    .ladder-badge {
      font-size: 10px; font-weight: 700; color: #636366;
      text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0;
    }
    .card-status { margin-top: 12px; font-size: 13px; color: #30d158; font-weight: 600; }
    .flip-hint { margin-top: auto; padding-top: 12px; font-size: 11px; color: #48484a; text-align: center; }

    /* ── Card back ── */
    .card-back {
      background: #2c2c2e;
      transform: rotateY(180deg);
      display: flex; flex-direction: column;
      padding: 14px 14px 14px;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
    .back-title { font-size: 17px; font-weight: 700; flex-shrink: 0; }

    /* ── Progression list ── */
    .progression-list { display: flex; flex-direction: column; gap: 10px; }

    .level-block {
      background: #3a3a3c; border-radius: 14px; padding: 11px 12px;
      display: flex; flex-direction: column; gap: 7px;
    }

    .level-header { display: flex; align-items: center; gap: 8px; }
    .level-badge {
      background: #48484a; color: #8e8e93; border-radius: 6px;
      padding: 2px 7px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }
    .level-name { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
    .level-last { font-size: 11px; color: #636366; padding-left: 2px; }

    /* ── Set controls ── */
    .row-top { display: flex; align-items: center; gap: 8px; }
    .note-input {
      flex: 1; background: #1c1c1e; color: #f2f2f7;
      border: 1px solid #48484a; border-radius: 8px;
      padding: 7px 10px; font-size: 14px;
    }
    .note-input:focus { outline: none; border-color: #0a84ff; }
    .del-row-btn {
      background: #48484a; border: none; color: #ff453a;
      border-radius: 8px; width: 30px; height: 30px;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .sets-row { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
    .set-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .set-btn {
      background: #48484a; border: none; color: #f2f2f7;
      border-radius: 7px; width: 34px; height: 26px;
      font-size: 13px; cursor: pointer; line-height: 1;
    }
    .set-btn:active { opacity: 0.6; }
    .set-val {
      font-size: 22px; font-weight: 700; min-width: 34px; text-align: center;
      color: #f2f2f7; cursor: pointer; border-radius: 6px; padding: 1px 3px;
      transition: color 0.15s ease;
    }
    .set-val.highlighted { color: #30d158; }
    .del-set-btn {
      background: none; border: none; color: #48484a;
      font-size: 11px; cursor: pointer; padding: 0;
    }
    .del-set-btn:active { color: #ff453a; }
    .add-set-btn {
      background: #48484a; border: none; color: #0a84ff;
      border-radius: 7px; padding: 5px 9px; font-size: 12px;
      cursor: pointer; align-self: flex-end;
    }
    .add-row-btn {
      background: none; border: 1px dashed #48484a; color: #636366;
      border-radius: 8px; padding: 5px; font-size: 11px;
      cursor: pointer; text-align: center;
    }
    .add-row-btn:active { border-color: #0a84ff; color: #0a84ff; }

    /* ── Submit ── */
    .submit-btn {
      background: #30d158; border: none; color: #000;
      border-radius: 14px; padding: 13px; font-size: 16px; font-weight: 700;
      cursor: pointer; flex-shrink: 0; width: 100%;
    }
    .submit-btn:active { opacity: 0.8; }
    .submit-btn:disabled { background: #2c2c2e; color: #636366; }

    /* ── Completed ── */
    #completed-section {
      width: calc(100% - 32px); max-width: 420px;
      padding: 8px 0 12px; flex-shrink: 0;
    }
    #completed-label { font-size: 12px; color: #48484a; text-align: center; margin-bottom: 4px; }
    #completed-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .completed-chip {
      background: #1a3a1a; color: #30d158; border-radius: 8px;
      padding: 4px 10px; font-size: 12px; font-weight: 600;
    }

    /* ── Shared ── */
    .btn {
      padding: 12px 24px; border-radius: 12px; border: none;
      background: #0a84ff; color: white; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .btn:active { opacity: 0.8; }
    .btn.ghost { background: #2c2c2e; color: #8e8e93; }

    #loading { color: #8e8e93; font-size: 15px; margin-top: 60px; }
  </style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <h1>💪 Reps2</h1>
  <p>Sign in with Google to load your workout data.</p>
  <button class="btn" onclick="connectGoogle()">Connect with Google</button>
  <a href="../index.html" style="color:#48484a;font-size:13px;margin-top:8px">← Back</a>
</div>

<!-- Loading -->
<div id="loading" style="display:none">Loading…</div>

<!-- Cycle picker -->
<div id="cycle-screen"></div>

<!-- Workout -->
<div id="workout-screen">
  <div id="workout-header">
    <div>
      <h2 id="cycle-title"></h2>
      <div id="session-label" style="font-size:12px;color:#8e8e93;margin-top:2px"></div>
    </div>
    <div class="header-right">
      <span id="progress-label"></span>
      <button class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="showCyclePicker()">↩</button>
    </div>
  </div>
  <div id="card-area"></div>
  <div id="completed-section" style="display:none">
    <div id="completed-label">Completed</div>
    <div id="completed-chips"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────────────────────────
const CLIENT_ID = "849477607564-p3jib8rsfvlv2fgsif1avafrjo4qac5k.apps.googleusercontent.com";
const SHEET_ID  = "1JuWrIRP1aLT-clyunBYi4JXGoApalDRt5SrQRXSYywg";
const LOG_RANGE = "Reps2Log";

const CYCLES = [
  { id: "Pull", label: "Pull Day",  sub: "Back · Biceps · Rear delts"    },
  { id: "Push", label: "Push Day",  sub: "Chest · Shoulders · Triceps"   },
  { id: "Core", label: "Core Day",  sub: "Abs · Core · Stability"        },
];

// 0-based sheet column indices for Reps2Log
// A=MovementFamily, B=MuscleGroups, C=CycleType, D=SessionLog, E-I=L1-L5
const COL = {
  movementFamily: 0,
  muscleGroups:   1,
  cycleType:      2,
  sessionLog:     3,
  levels:         [4, 5, 6, 7, 8],
};
const LEVEL_COL_LETTERS = ["E", "F", "G", "H", "I"];

// ─────────────────────────────────────────────────────────────────────────────
// Auth
// ─────────────────────────────────────────────────────────────────────────────
let accessToken = null;

function connectGoogle() {
  const redirect = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirect,
    response_type: "token",
    scope: "https://www.googleapis.com/auth/spreadsheets",
  });
  window.location = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function handleAuth() {
  const hash = window.location.hash;
  if (hash.includes("access_token")) {
    const p = new URLSearchParams(hash.substring(1));
    accessToken = decodeURIComponent(p.get("access_token"));
    window.location.hash = "";
    return true;
  }
  return false;
}

// ─────────────────────────────────────────────────────────────────────────────
// Sheets API
// ─────────────────────────────────────────────────────────────────────────────
async function fetchRange(range) {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const data = await res.json();
  return data.values || [];
}

async function putCell(range, value) {
  await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
    {
      method: "PUT",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ range, values: [[value]] }),
    }
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Date / stamp helpers
// ─────────────────────────────────────────────────────────────────────────────
function todayPrefix() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function todayStamp() {
  const ampm = new Date().getHours() < 13 ? "AM" : "PM";
  return `${todayPrefix()} ${ampm} — `;
}

// ─────────────────────────────────────────────────────────────────────────────
// Lx cell parsing
// Each Lx cell: line 0 = exercise name, lines 1-N = dated history
// ─────────────────────────────────────────────────────────────────────────────
function parseLx(cell) {
  if (!cell) return { name: "", history: "" };
  const lines = cell.split("\n");
  return { name: lines[0].trim(), history: lines.slice(1).join("\n") };
}

// Parse the last history line into [{note, sets:[{val,fail}]}]
// Format: "YYYY-MM-DD AM/PM — note: 8,8,10 ; note2: 5"
function parseLastEntry(history) {
  if (!history || !history.trim()) return null;
  const lines = history.trim().split("\n");
  const last = lines[lines.length - 1];
  const body = last.replace(/^\d{4}-\d{2}-\d{2}\s+[AP]M\s+—\s+/, "").trim();
  if (!body) return null;
  return body.split(/\s*;\s*/).map(block => {
    const ci = block.indexOf(":");
    const note = ci >= 0 ? block.slice(0, ci).trim() : "";
    const setsPart = ci >= 0 ? block.slice(ci + 1).trim() : block.trim();
    const sets = setsPart.split(",").map(s => {
      s = s.trim();
      return { val: parseInt(s) || 0, fail: s.endsWith("+") };
    });
    return { note, sets };
  });
}

function formatEntry(rows) {
  return rows.map(r => {
    const setsStr = r.sets.map(s => s.val + (s.fail ? "+" : "")).join(",");
    return r.note ? `${r.note}: ${setsStr}` : setsStr;
  }).join(" ; ");
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ─────────────────────────────────────────────────────────────────────────────
// Data
// ─────────────────────────────────────────────────────────────────────────────
let exercises = [];

async function loadExercises() {
  show("loading");
  const rows = await fetchRange(LOG_RANGE);
  exercises = [];
  const today = todayPrefix();

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const movementFamily = (row[COL.movementFamily] || "").trim();
    if (!movementFamily) continue;

    const sessionLog = row[COL.sessionLog] || "";
    const doneToday = sessionLog
      ? sessionLog.split("\n").some(l => l.trim().startsWith(today))
      : false;

    // Parse L1-L5; keep only those with a name
    const levels = COL.levels.map((colIdx, li) => {
      const { name, history } = parseLx(row[colIdx] || "");
      return {
        label:     `L${li + 1}`,
        colLetter: LEVEL_COL_LETTERS[li],
        name,
        history,
        lastEntry: parseLastEntry(history),
      };
    }).filter(l => l.name);

    if (levels.length === 0) continue;

    exercises.push({
      sheetRow: i + 1,
      movementFamily,
      muscleGroups: row[COL.muscleGroups] || "",
      cycleType:    row[COL.cycleType]    || "",
      sessionLog,
      doneToday,
      levels,
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Cycle picker
// ─────────────────────────────────────────────────────────────────────────────
function showCyclePicker() {
  teardownPileNavigation();
  show("cycle-screen");
  const el = document.getElementById("cycle-screen");
  el.innerHTML = "";

  const h = document.createElement("h2");
  h.style.marginBottom = "4px";
  h.textContent = "Choose Workout";
  el.appendChild(h);

  const date = document.createElement("div");
  date.style.cssText = "font-size:13px;color:#636366;margin-bottom:16px";
  date.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  el.appendChild(date);

  CYCLES.forEach(c => {
    const exForCycle = exercises.filter(e => e.cycleType === c.id);
    const count = exForCycle.length;
    const doneCount = exForCycle.filter(e => e.doneToday).length;
    const btn = document.createElement("button");
    btn.className = "cycle-btn";
    const countTag = count > 0
      ? `<span style="color:#8e8e93;font-size:13px;font-weight:400"> (${doneCount}/${count})</span>`
      : `<span style="color:#48484a;font-size:13px;font-weight:400"> —</span>`;
    if (doneCount === count && count > 0) btn.style.background = "#1a3a1a";
    btn.innerHTML = `${esc(c.label)}${countTag}<div class="cycle-sub">${esc(c.sub)}</div>`;
    btn.onclick = () => startWorkout(c.id, c.label);
    el.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Workout
// ─────────────────────────────────────────────────────────────────────────────
let deck = [];
let activeIdx = 0;

function startWorkout(cycleId, label) {
  deck = exercises.filter(e => e.cycleType === cycleId);

  // pending first (shuffled), done-today at end
  const pending = deck.filter(e => !e.doneToday);
  const done    = deck.filter(e => e.doneToday);
  for (let i = pending.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pending[i], pending[j]] = [pending[j], pending[i]];
  }
  deck = [...pending, ...done];

  activeIdx = deck.findIndex(e => !e.doneToday);
  if (activeIdx < 0) activeIdx = 0;

  document.getElementById("cycle-title").textContent = label;
  document.getElementById("session-label").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  show("workout-screen");
  setupPileNavigation();
  renderDeck();
}

// ─────────────────────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────────────────────
function renderDeck() {
  const area = document.getElementById("card-area");
  area.innerHTML = "";

  updateProgress();
  updateCompleted();

  if (deck.length === 0) {
    area.innerHTML = `<div style="color:#8e8e93;text-align:center;font-size:16px;padding:40px 24px">No exercises found.<br>Add rows to the Reps2Log sheet.</div>`;
    return;
  }

  if (deck.every(e => e.doneToday)) {
    const done = document.createElement("div");
    done.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 24px;text-align:center;width:100%";
    done.innerHTML = `
      <div style="font-size:48px">🎉</div>
      <h2 style="font-size:26px">All done!</h2>
      <p style="color:#8e8e93;font-size:14px">Session complete.</p>
      <button class="btn" onclick="showCyclePicker()">Choose Another Day</button>
    `;
    area.appendChild(done);
    return;
  }

  for (let offset = 2; offset >= 0; offset--) {
    const ex = deck[(activeIdx + offset) % deck.length];
    if (!ex) continue;
    area.appendChild(buildCard(ex, offset === 0));
  }
}

function cycleActive(dir) {
  activeIdx = (activeIdx + dir + deck.length) % deck.length;
  renderDeck();
}

function updateProgress() {
  const total = deck.length;
  const done  = deck.filter(e => e.doneToday).length;
  document.getElementById("progress-label").textContent = total > 0 ? `${done}/${total}` : "";
}

function updateCompleted() {
  const done = deck.filter(e => e.doneToday);
  const section = document.getElementById("completed-section");
  if (done.length === 0) { section.style.display = "none"; return; }
  section.style.display = "";
  document.getElementById("completed-chips").innerHTML =
    done.map(e => `<div class="completed-chip">${esc(e.movementFamily)}</div>`).join("");
}

// ─────────────────────────────────────────────────────────────────────────────
// Card building
// ─────────────────────────────────────────────────────────────────────────────
function buildCard(ex, isTop) {
  const card = document.createElement("div");
  card.className = "card" + (isTop ? " top" : "");

  const inner = document.createElement("div");
  inner.className = "card-inner";
  inner.appendChild(buildFront(ex));
  inner.appendChild(buildBack(ex));
  card.appendChild(inner);

  if (isTop) {
    card.addEventListener("click", e => {
      if (e.target.closest("button, input, textarea")) return;
      card.classList.toggle("flipped");
    });
  }
  return card;
}

function buildFront(ex) {
  const face = document.createElement("div");
  face.className = "card-face card-front" + (ex.doneToday ? " done-today" : "");

  // Last session date
  const lastDate = ex.sessionLog
    ? ex.sessionLog.trim().split("\n").pop().trim().slice(0, 10)
    : null;

  const ladderRows = ex.levels.map(l => `
    <div class="ladder-item">
      <span class="ladder-badge">${esc(l.label)}</span>
      <span>${esc(l.name)}</span>
    </div>`).join("");

  face.innerHTML = `
    <div class="card-name">${esc(ex.movementFamily)}</div>
    <div class="card-meta">${esc(ex.muscleGroups)}</div>
    <div class="card-ladder">
      <div class="ladder-label">Progression</div>
      ${ladderRows}
    </div>
    ${lastDate
      ? `<div class="card-status">${ex.doneToday ? "✓ Done today" : "Last: " + lastDate}</div>`
      : ""}
    <div class="flip-hint">Tap to open · Swipe to navigate</div>
  `;
  return face;
}

function buildBack(ex) {
  const face = document.createElement("div");
  face.className = "card-face card-back";

  const title = document.createElement("div");
  title.className = "back-title";
  title.textContent = ex.movementFamily;
  face.appendChild(title);

  const controls = buildProgressionControls(ex);
  face.appendChild(controls);

  const submitBtn = document.createElement("button");
  submitBtn.className = "submit-btn";
  submitBtn.textContent = "✓ Log & Complete";
  submitBtn.onclick = (e) => {
    e.stopPropagation();
    submitCard(ex, face.closest(".card"), submitBtn);
  };
  face.appendChild(submitBtn);

  return face;
}

// ─────────────────────────────────────────────────────────────────────────────
// Draft persistence (localStorage)
// Key: "reps2_draft_{sheetRow}_{levelLabel}"
// Cleared on successful save.
// ─────────────────────────────────────────────────────────────────────────────
function draftKey(ex, level) {
  return `reps2_draft_${ex.sheetRow}_${level.label}`;
}

function saveDraft(ex, level, rows) {
  try {
    localStorage.setItem(draftKey(ex, level), JSON.stringify(rows));
  } catch (e) { /* storage full or private mode — fail silently */ }
}

function loadDraft(ex, level) {
  try {
    const raw = localStorage.getItem(draftKey(ex, level));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearDraft(ex, level) {
  try {
    localStorage.removeItem(draftKey(ex, level));
  } catch (e) {}
}

// ─────────────────────────────────────────────────────────────────────────────
// Progression controls
// Builds a scrollable list of level blocks (L1–L5), each with set controls.
// ─────────────────────────────────────────────────────────────────────────────
function buildProgressionControls(ex) {
  const list = document.createElement("div");
  list.className = "progression-list";

  ex.levels.forEach(level => {
    const block = document.createElement("div");
    block.className = "level-block";
    block._level = level;

    // Seed priority: localStorage draft → last sheet entry → 3 empty sets
    const draft = loadDraft(ex, level);
    const seed = draft
      ? draft
      : (level.lastEntry && Array.isArray(level.lastEntry))
        ? level.lastEntry.map(r => ({
            note: r.note,
            sets: r.sets.map(s => ({ val: s.val, fail: false, highlighted: false })),
          }))
        : [{ note: "", sets: [
            { val: 0, fail: false, highlighted: false },
            { val: 0, fail: false, highlighted: false },
            { val: 0, fail: false, highlighted: false },
          ]}];
    block._rows = seed;

    function rerender() {
      saveDraft(ex, level, block._rows);
      block.innerHTML = "";

      // Level header
      const header = document.createElement("div");
      header.className = "level-header";
      const badge = document.createElement("span");
      badge.className = "level-badge";
      badge.textContent = level.label;
      const nameEl = document.createElement("div");
      nameEl.className = "level-name";
      nameEl.textContent = level.name;
      header.appendChild(badge);
      header.appendChild(nameEl);
      block.appendChild(header);

      // Last entry summary
      if (level.lastEntry && Array.isArray(level.lastEntry)) {
        const lastEl = document.createElement("div");
        lastEl.className = "level-last";
        lastEl.textContent = "Last: " + level.lastEntry.map(r => {
          const s = r.sets.map(s => s.val).join(",");
          return r.note ? `${r.note}: ${s}` : s;
        }).join(" · ");
        block.appendChild(lastEl);
      }

      // Weight/set rows
      block._rows.forEach((row, ri) => {
        const rowTop = document.createElement("div");
        rowTop.className = "row-top";

        const noteInput = document.createElement("input");
        noteInput.type = "text";
        noteInput.className = "note-input";
        noteInput.placeholder = "weight / note";
        noteInput.value = row.note;
        noteInput.addEventListener("input", e => {
          block._rows[ri].note = e.target.value;
          saveDraft(ex, level, block._rows);
        });
        rowTop.appendChild(noteInput);

        if (block._rows.length > 1) {
          const delRow = document.createElement("button");
          delRow.className = "del-row-btn";
          delRow.textContent = "×";
          delRow.onclick = (e) => { e.stopPropagation(); block._rows.splice(ri, 1); rerender(); };
          rowTop.appendChild(delRow);
        }
        block.appendChild(rowTop);

        const setsRow = document.createElement("div");
        setsRow.className = "sets-row";

        row.sets.forEach((set, si) => {
          const col = document.createElement("div");
          col.className = "set-col";

          const incBtn = document.createElement("button");
          incBtn.className = "set-btn";
          incBtn.textContent = "▲";
          incBtn.onclick = (e) => { e.stopPropagation(); block._rows[ri].sets[si].val++; rerender(); };

          const valEl = document.createElement("div");
          valEl.className = "set-val" + (set.highlighted ? " highlighted" : "");
          valEl.textContent = set.val;
          valEl.onclick = (e) => {
            e.stopPropagation();
            block._rows[ri].sets[si].highlighted = !block._rows[ri].sets[si].highlighted;
            rerender();
          };

          const decBtn = document.createElement("button");
          decBtn.className = "set-btn";
          decBtn.textContent = "▼";
          decBtn.onclick = (e) => {
            e.stopPropagation();
            if (block._rows[ri].sets[si].val > 0) { block._rows[ri].sets[si].val--; rerender(); }
          };

          const delSet = document.createElement("button");
          delSet.className = "del-set-btn";
          delSet.textContent = "✕";
          delSet.onclick = (e) => { e.stopPropagation(); block._rows[ri].sets.splice(si, 1); rerender(); };

          col.appendChild(incBtn);
          col.appendChild(valEl);
          col.appendChild(decBtn);
          col.appendChild(delSet);
          setsRow.appendChild(col);
        });

        const addSet = document.createElement("button");
        addSet.className = "add-set-btn";
        addSet.textContent = "+ set";
        addSet.onclick = (e) => {
          e.stopPropagation();
          block._rows[ri].sets.push({ val: 0, fail: false, highlighted: false });
          rerender();
        };
        setsRow.appendChild(addSet);
        block.appendChild(setsRow);
      });

      // Add weight row button
      const addRow = document.createElement("button");
      addRow.className = "add-row-btn";
      addRow.textContent = "+ add weight row";
      addRow.onclick = (e) => {
        e.stopPropagation();
        block._rows.push({ note: "", sets: [{ val: 0, fail: false, highlighted: false }] });
        rerender();
      };
      block.appendChild(addRow);
    }

    rerender();
    list.appendChild(block);
  });

  return list;
}

// ─────────────────────────────────────────────────────────────────────────────
// Submit
// Writes each Lx column + appends today to SessionLog (column D)
// ─────────────────────────────────────────────────────────────────────────────
async function submitCard(ex, cardEl, btn) {
  btn.disabled = true;
  btn.textContent = "Saving…";

  const stamp = todayStamp();
  const today = todayPrefix();

  const list = cardEl.querySelector(".progression-list");
  const blocks = Array.from(list.querySelectorAll(".level-block"));

  const writes = [];

  ex.levels.forEach((level, li) => {
    const block = blocks[li];
    if (!block || !block._rows) return;
    const entryBody = formatEntry(block._rows);
    const newLine = stamp + entryBody;
    const newHistory = level.history ? level.history + "\n" + newLine : newLine;
    const newCell = level.name + "\n" + newHistory;

    // Update local state
    level.history = newHistory;
    level.lastEntry = parseLastEntry(newHistory);

    // Clear the draft now that it's committed to the sheet
    clearDraft(ex, level);

    writes.push(putCell(`${LOG_RANGE}!${level.colLetter}${ex.sheetRow}`, newCell));
  });

  // SessionLog: append today's date
  const newSessionLog = ex.sessionLog ? ex.sessionLog + "\n" + today : today;
  writes.push(putCell(`${LOG_RANGE}!D${ex.sheetRow}`, newSessionLog));

  // Update local deck state immediately
  deck[activeIdx].doneToday = true;
  deck[activeIdx].sessionLog = newSessionLog;

  // Advance to next pending
  const nextPending = deck.findIndex((e, i) => i !== activeIdx && !e.doneToday);
  if (nextPending >= 0) activeIdx = nextPending;

  renderDeck();

  await Promise.all(writes);
}

// ─────────────────────────────────────────────────────────────────────────────
// Pile navigation (swipe + keyboard)
// ─────────────────────────────────────────────────────────────────────────────
function setupPileNavigation() {
  let startX = 0, startY = 0;

  window._pileOnTouchStart = e => {
    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;
  };
  window._pileOnTouchMove = e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
  };
  window._pileOnTouchEnd = e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) cycleActive(dx < 0 ? 1 : -1);
  };
  window._pileOnKeyDown = e => {
    if (e.key === "ArrowRight") cycleActive(1);
    if (e.key === "ArrowLeft")  cycleActive(-1);
  };

  document.addEventListener("touchstart", window._pileOnTouchStart, { passive: true });
  document.addEventListener("touchmove",  window._pileOnTouchMove,  { passive: false });
  document.addEventListener("touchend",   window._pileOnTouchEnd);
  document.addEventListener("keydown",    window._pileOnKeyDown);
}

function teardownPileNavigation() {
  document.removeEventListener("touchstart", window._pileOnTouchStart);
  document.removeEventListener("touchmove",  window._pileOnTouchMove);
  document.removeEventListener("touchend",   window._pileOnTouchEnd);
  document.removeEventListener("keydown",    window._pileOnKeyDown);
}

// ─────────────────────────────────────────────────────────────────────────────
// Screen switching
// ─────────────────────────────────────────────────────────────────────────────
function show(id) {
  ["auth-screen", "loading", "cycle-screen", "workout-screen"].forEach(s => {
    const el = document.getElementById(s);
    if (el) el.style.display = s === id
      ? (s === "workout-screen" || s === "cycle-screen" ? "flex" : "")
      : "none";
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
async function boot() {
  const authed = handleAuth();
  if (!authed) { show("auth-screen"); return; }
  await loadExercises();
  showCyclePicker();
}

boot();
</script>
