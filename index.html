<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheets App</title>

  <style>
    body {
      font-family: -apple-system;
      background: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 { font-size: 32px; }

    button {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #007aff;
      color: white;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div>
  <h1 id="title">Connect</h1>
  <button onclick="login()">Connect Google</button>
  <button onclick="writeToSheet()">Write Current</button>
</div>

<script>
const CLIENT_ID = "2867736651-0udg6q711nod551b0u3so9sl7kqe79s7.apps.googleusercontent.com";
const SHEET_ID = "1cf-gc2MKCild2JgPt2nFXSbpXcGr8g_r68aMDRdQfw4";
const RANGE = "AppData01!A1:A100";

let accessToken;
let messages = [];
let index = 0;

// LOGIN
function login() {
  const redirect = window.location.origin + window.location.pathname;

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirect,
    response_type: "token",
    scope: "https://www.googleapis.com/auth/spreadsheets"
  });

  const url = `https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`;

  window.location = url;
}

// HANDLE TOKEN
function handleAuth() {
  const hash = window.location.hash;

  if (hash.includes("access_token")) {
    const params = new URLSearchParams(hash.substring(1));
    accessToken = params.get("access_token");

    // ✅ clear hash so it doesn't break future logins
    window.location.hash = "";

    fetchSheet();
  }
}

// READ
async function fetchSheet() {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}`,
    {
      headers: { Authorization: `Bearer ${accessToken}` }
    }
  );

  const data = await res.json();
  messages = data.values.map(r => r[0]);
  document.getElementById("title").textContent = messages[0];
}

// WRITE (example: overwrite A1)
async function writeToSheet() {
  const value = messages[index] || "Hello 👋";

  await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1!A1?valueInputOption=RAW`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        range: "Sheet1!A1",
        values: [[value]]
      })
    }
  );

  alert("Wrote to sheet!");
}

// SWIPE
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].screenX - startX;

  if (Math.abs(diff) > 50 && messages.length) {
    index = (index + (diff < 0 ? 1 : -1) + messages.length) % messages.length;
    document.getElementById("title").textContent = messages[index];
  }
});

handleAuth();
</script>

</body>
</html>
