<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Tody</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
    }

    /* ── Home screen ── */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #home h1 { font-size: 32px; color: #1c1c1e; }

    .btn {
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      min-width: 200px;
    }
    .btn:active { opacity: 0.8; }
    .btn.secondary { background: #34c759; }

    /* ── Tody view ── */
    #tody-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px 0 10px;
    }

    #tody-view h2 { font-size: 24px; color: #1c1c1e; }
    #tody-view > div:first-child { margin-bottom: 8px; }

    /* ── Pile list ── */
    #piles-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-y: auto;
      flex: 1;
      padding: 0 12px 12px;
      gap: 0;
    }

    .pile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      cursor: pointer;
      border-bottom: 1px solid #e5e5ea;
      transition: background 0.2s;
    }
    .pile-row:last-child { border-bottom: none; }

    .pile-label {
      font-size: 10px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      width: 48px;
      text-align: right;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .pile-row.active .pile-label { color: #1c1c1e; }

    /* collapsed: just a thin strip */
    .pile-stack {
      position: relative;
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: #e5e5ea;
      overflow: hidden;
      transition: height 0.35s ease;
      flex-shrink: 0;
    }

    /* expanded active pile */
    .pile-row.active .pile-stack {
      height: 350px;
      border-radius: 16px;
    }

    /* shadow cards only on active — positioned relative to stack */
    .pile-row.active .pile-stack::before,
    .pile-row.active .pile-stack::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: #d1d1d6;
      pointer-events: none;
    }
    .pile-row.active .pile-stack::before { top: 8px; left: 5px; z-index: 0; transform: rotate(2deg); }
    .pile-row.active .pile-stack::after  { top: 5px; left: 3px; z-index: 1; transform: rotate(1deg); }

    .pile-stack.empty { background: #f2f2f7; border: 2px dashed #d1d1d6; }

    /* collapsed preview: show title text */
    .pile-stack .pile-preview {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 3;
    }
    .pile-row.active .pile-stack .pile-preview { display: none; }

    .pile-empty-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #c7c7cc;
      z-index: 2;
    }

    .pile-counts {
      width: 48px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .pile-count {
      font-size: 11px;
      color: #8e8e93;
      line-height: 1.3;
    }

    .pile-count span { font-weight: 700; color: #3a3a3c; }
    .pile-count.done-count span  { color: #34c759; }
    .pile-count.defer-count span { color: #ff9500; }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
      perspective: 1000px;
      cursor: pointer;
      touch-action: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      border-radius: 20px;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-front {
      background: white;
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .card.overdue  .card-front { background: #ff3b30; color: white; }
    .card.due-soon .card-front { background: #34c759; color: white; }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .card-due {
      font-size: 14px;
      opacity: 0.75;
    }

    .card-back {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 7px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      background: #1c1c1e;
      color: white;
      transform: rotateY(180deg);
      overflow-y: auto;
    }

    .detail-pair {
      display: flex;
      gap: 12px;
    }

    .detail-pair .detail-col {
      flex: 1;
    }

    .detail-row, .detail-col {
      font-size: 13px;
      line-height: 1.4;
    }

    .detail-label {
      font-weight: 600;
      opacity: 0.6;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .detail-notes {
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.85;
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 8px;
    }

    .complete-now-btn {
      margin-top: auto;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: #34c759;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      align-self: flex-start;
    }
    .complete-now-btn:active { opacity: 0.8; }

    /* confirm dialog */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #confirm-overlay.visible { display: flex; }
    #confirm-box {
      background: white;
      border-radius: 16px;
      padding: 24px 20px 16px;
      width: 280px;
      text-align: center;
    }
    #confirm-box h3 { font-size: 17px; margin-bottom: 8px; }
    #confirm-box p  { font-size: 14px; color: #3a3a3c; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #confirm-cancel { background: #e5e5ea; color: #1c1c1e; }
    #confirm-ok     { background: #34c759; color: white; }

    /* swipe animation */
    .card.swiping {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .card.swipe-left  { transform: translateX(-150%) rotate(-20deg); opacity: 0; }
    .card.swipe-right { transform: translateX(150%)  rotate(20deg);  opacity: 0; }

    /* hint text */
    #hint {
      margin-top: 12px;
      font-size: 12px;
      color: #8e8e93;
      text-align: center;
      line-height: 1.6;
    }

    #empty-msg {
      font-size: 20px;
      color: #8e8e93;
      text-align: center;
    }

    /* undo button */
    #undo-btn {
      margin-top: 10px;
      padding: 10px 28px;
      border-radius: 12px;
      border: none;
      background: #1c1c1e;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #undo-btn:active { opacity: 0.7; }

    #loading { color: #8e8e93; font-size: 16px; }
  </style>
</head>
<body>

<!-- Home -->
<div id="home">
  <h1>📋 My Apps</h1>
  <button class="btn" onclick="connectGoogle()">Connect</button>
  <button class="btn secondary" id="tody-btn" onclick="openTody()" style="display:none">Tody</button>
  <button class="btn" id="langacq-btn" onclick="openLangAcq()" style="display:none;background:#5856d6">LangAcqT</button>
  <button class="btn" id="reps-btn" onclick="openReps()" style="display:none;background:#ff9f0a">Reps</button>
</div>

<!-- Tody view -->
<div id="tody-view">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:0">
    <h2 style="margin:0">Tody</h2>
    <button class="btn" id="refresh-btn" onclick="refreshTody()" style="min-width:unset;padding:8px 14px;font-size:14px;background:#8e8e93">&#8635;</button>
  </div>
  <div id="loading" style="display:none">Loading...</div>
  <div id="piles-container" style="display:none"></div>
  <div id="empty-msg" style="display:none">All done! 🎉</div>
  <div id="hint">
    &#8592; Defer &nbsp;|&nbsp; &#8594; Complete &nbsp;|&nbsp; &#8593;&#8595; Switch pile<br>
    Tap to flip &nbsp;|&nbsp; Ctrl+Z to undo
  </div>
  <button id="undo-btn" onclick="undo()" style="display:none">↩ Undo</button>
</div>

<!-- Complete Now confirmation dialog -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <h3>Complete Now?</h3>
    <p id="confirm-msg">Mark this task as completed today?</p>
    <div class="confirm-actions">
      <button id="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button id="confirm-ok" onclick="confirmCompleteNow()">Complete Now</button>
    </div>
  </div>
</div>

<script>
const CLIENT_ID = "849477607564-p3jib8rsfvlv2fgsif1avafrjo4qac5k.apps.googleusercontent.com";
const SHEET_ID  = "1JuWrIRP1aLT-clyunBYi4JXGoApalDRt5SrQRXSYywg";
const TODY_RANGE = "Tody";

let accessToken = null;
let allCards = [];       // all parsed card objects
let piles = [];          // array of {label, cards[], hidden[], deferred, done, total, showHidden}
let activePile = 0;      // index into piles
let dismissed = [];      // stack for undo
let currentCard = null;  // active top card DOM element

// ── Pile classification ───────────────────────────────────────────────────

const LEVEL = { Low: 0, Medium: 1, High: 2 };

function pileIndex(card) {
  if (card.laundry) return 2;
  const s = LEVEL[card.soil]  ?? 1;
  const n = LEVEL[card.noise] ?? 1;
  if (s <= 0 && n <= 0) return 0;           // Low soil, Low noise
  if (s <= 1 && n <= 1) return 1;           // Low-Medium soil, Low-Medium noise
  if (s <= 1 && n <= 2) return 3;           // Low-Medium soil, High noise
  return 4;                                  // High noise / high soil
}

const PILE_LABELS = ["Low\nSoil+Noise", "Med\nSoil+Noise", "Laundry", "Low-Med\nSoil, Hi Noise", "High\nNoise"];

function buildPiles(cards) {
  const buckets = [[], [], [], [], []];
  cards.forEach(c => buckets[pileIndex(c)].push(c));
  return PILE_LABELS.map((label, i) => {
    const all = buckets[i];
    const hidden = all.filter(c => daysOverdue(c.lastDone, c.frequency, c.unit) < 0);
    const active = all.filter(c => daysOverdue(c.lastDone, c.frequency, c.unit) >= 0);
    return { label, cards: active, hidden, deferred: 0, done: hidden.length, total: all.length, showHidden: false };
  });
}

// ── Auth ──────────────────────────────────────────────────────────────────

function connectGoogle() {
  const redirect = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirect,
    response_type: "token",
    scope: "https://www.googleapis.com/auth/spreadsheets"
  });
  window.location = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

function handleAuth() {
  const hash = window.location.hash;
  if (hash.includes("access_token")) {
    const params = new URLSearchParams(hash.substring(1));
    accessToken = params.get("access_token");
    window.location.hash = "";
    document.getElementById("tody-btn").style.display = "";
    document.getElementById("langacq-btn").style.display = "";
    document.getElementById("reps-btn").style.display = "";
  }
}

function openLangAcq() {
  window.location = `lang-acq/index.html#access_token=${encodeURIComponent(accessToken)}&token_type=Bearer`;
}

function openReps() {
  window.location = `reps/index.html#access_token=${encodeURIComponent(accessToken)}&token_type=Bearer`;
}

// ── Date helpers ──────────────────────────────────────────────────────────

function parseMmDd(str) {
  if (!str) return null;
  const parts = str.split("/").map(Number);
  if (parts.length === 3) {
    const [m, d, y] = parts;
    return new Date(y, m - 1, d);
  }
  const [m, d] = parts;
  if (!m || !d) return null;
  const now = new Date();
  const date = new Date(now.getFullYear(), m - 1, d);
  if (date - now > 180 * 86400000) date.setFullYear(date.getFullYear() - 1);
  return date;
}

function daysOverdue(lastDone, frequency, unit) {
  // lastDone may be multi-line history — use the last (most recent) date
  const lastLine = lastDone ? lastDone.trim().split("\n").pop().trim() : "";
  const last = parseMmDd(lastLine);
  if (!last) return null;
  let freqDays;
  if (unit === "weeks")       freqDays = frequency * 7;
  else if (unit === "months") freqDays = frequency * 30;
  else                        freqDays = frequency;
  const nextDue = new Date(last.getTime() + freqDays * 86400000);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.floor((today - nextDue) / 86400000);
}

function todayMmDd() {
  const d = new Date();
  return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
}

// ── Sheets API ────────────────────────────────────────────────────────────

async function fetchTody() {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${TODY_RANGE}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const data = await res.json();
  return data.values || [];
}

async function markComplete(dataIndex, value) {
  const sheetRow = dataIndex + 1;
  const range = `Tody!D${sheetRow}`;
  await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ range, values: [[value]] })
    }
  );
}

// ── Tody UI ───────────────────────────────────────────────────────────────

async function openTody() {
  document.getElementById("home").style.display = "none";
  document.getElementById("tody-view").style.display = "flex";
  await loadTody();
}

async function refreshTody() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  await loadTody();
  btn.disabled = false;
}

async function loadTody() {
  dismissed = [];
  activePile = 0;
  document.getElementById("loading").style.display = "";
  document.getElementById("piles-container").style.display = "none";
  document.getElementById("empty-msg").style.display = "none";

  const rows = await fetchTody();
  document.getElementById("loading").style.display = "none";

  // rows[0] is header: Title, Frequency, FrequencyUnits, LastDone, Notes, Soil, Noise
  allCards = rows.slice(1).map((row, i) => ({
    sheetRow:  i + 2,
    dataIndex: i + 1,
    title:     row[0] || "",
    frequency: parseInt(row[1]) || 0,
    unit:      row[2] || "days",
    lastDone:  row[3] || "",
    notes:     row[4] || "",
    soil:      row[5] || "",
    noise:     row[6] || "",
    laundry:   row[7] === "Yes",
  }));

  piles = buildPiles(allCards);
  renderPiles();
}

function renderPiles() {
  const container = document.getElementById("piles-container");
  const empty = document.getElementById("empty-msg");
  container.innerHTML = "";
  currentCard = null;

  const total = piles.reduce((s, p) => s + p.cards.length, 0);
  if (total === 0) {
    container.style.display = "none";
    empty.style.display = "";
    return;
  }

  container.style.display = "flex";
  empty.style.display = "none";

  piles.forEach((pile, i) => {
    const isActive = i === activePile;
    const row = document.createElement("div");
    row.className = `pile-row${isActive ? " active" : ""}`;
    row.dataset.pileIndex = i;

    const label = document.createElement("div");
    label.className = "pile-label";
    label.textContent = pile.label;

    const stack = document.createElement("div");
    const isEmpty = pile.cards.length === 0 && !(pile.showHidden && pile.hidden.length > 0);
    stack.className = "pile-stack" + (isEmpty ? " empty" : "");
    stack.id = `pile-stack-${i}`;

    if (!isActive) {
      // collapsed: show preview strip with top card title
      const preview = document.createElement("div");
      preview.className = "pile-preview";
      const displayCards = pile.showHidden ? pile.hidden : pile.cards;
      preview.textContent = isEmpty ? "Done" : displayCards[0]?.title || "";
      stack.appendChild(preview);
    } else if (isEmpty) {
      const emptyLbl = document.createElement("div");
      emptyLbl.className = "pile-empty-label";
      emptyLbl.textContent = "Done";
      stack.appendChild(emptyLbl);
    } else {
      const displayCards = pile.showHidden ? pile.hidden : pile.cards;
      const card = displayCards[0];
      const overdue = daysOverdue(card.lastDone, card.frequency, card.unit);
      const el = buildCardEl(card, overdue);
      stack.appendChild(el);
      currentCard = el;
      attachSwipe(el, card, i);
    }

    const counts = document.createElement("div");
    counts.className = "pile-counts";
    const remaining = pile.showHidden ? pile.hidden.length : pile.cards.length;
    const doneEl = document.createElement("div");
    doneEl.className = "pile-count done-count";
    doneEl.style.cursor = pile.hidden.length > 0 ? "pointer" : "default";
    doneEl.innerHTML = `<span>${pile.done}</span> done${pile.showHidden ? " ▲" : pile.hidden.length > 0 ? " ▼" : ""}`;
    if (pile.hidden.length > 0) {
      doneEl.addEventListener("click", e => {
        e.stopPropagation();
        piles[i].showHidden = !piles[i].showHidden;
        activePile = i;
        renderPiles();
      });
    }
    counts.innerHTML = `
      <div class="pile-count"><span>${remaining}</span> left</div>
      <div class="pile-count defer-count"><span>${pile.deferred}</span> defer</div>`;
    counts.appendChild(doneEl);

    if (!isActive) {
      row.style.cursor = "pointer";
      row.addEventListener("click", () => { activePile = i; renderPiles(); });
    }

    row.appendChild(label);
    row.appendChild(stack);
    row.appendChild(counts);
    container.appendChild(row);
  });
}

function buildCardEl(card, overdue) {
  const el = document.createElement("div");
  el.className = "card";
  if (overdue > 0)       el.classList.add("overdue");
  else if (overdue <= 0) el.classList.add("due-soon");

  let dueText;
  if (overdue === null)     dueText = "";
  else if (overdue > 0)     dueText = `${overdue} day${overdue !== 1 ? "s" : ""} overdue`;
  else if (overdue === 0)   dueText = "Due today";
  else                      dueText = `Due in ${Math.abs(overdue)} day${Math.abs(overdue) !== 1 ? "s" : ""}`;

  const freqLabel = `Every ${card.frequency} ${card.unit}`;

  el.innerHTML = `
    <div class="card-inner">
      <div class="card-front">
        <div class="card-title">${card.title}</div>
        <div class="card-due">${dueText}</div>
      </div>
      <div class="card-back">
        <div class="detail-row"><div class="detail-label">Title</div>${card.title}</div>
        <div class="detail-pair">
          <div class="detail-col"><div class="detail-label">Frequency</div>Every ${card.frequency} ${card.unit}</div>
          <div class="detail-col"><div class="detail-label">Last Done</div>${card.lastDone || "—"}</div>
        </div>
        <div class="detail-pair">
          ${card.soil  ? `<div class="detail-col"><div class="detail-label">Soil</div>${card.soil}</div>`  : ""}
          ${card.noise ? `<div class="detail-col"><div class="detail-label">Noise</div>${card.noise}</div>` : ""}
        </div>
        ${card.laundry ? `<div class="detail-row"><div class="detail-label">Laundry</div>Yes</div>` : ""}
        ${card.notes ? `<div class="detail-notes"><div class="detail-label">Notes</div>${card.notes.replace(/\n/g, "<br>")}</div>` : ""}
        <button class="complete-now-btn" data-card-id="${card.dataIndex}">✓ Complete Now</button>
      </div>
    </div>`;

  return el;
}

// ── Swipe ─────────────────────────────────────────────────────────────────

function attachSwipe(el, card, pileIdx) {
  let startX = 0, startY = 0;

  // double-click / double-tap to shuffle; single click to flip
  let lastTap = 0;
  el.addEventListener("click", e => {
    if (e.target.classList.contains("complete-now-btn")) {
      e.stopPropagation();
      openConfirm(el, card, pileIdx);
      return;
    }
    const now = Date.now();
    if (now - lastTap < 300) {
      e.stopPropagation();
      shufflePile(pileIdx);
    } else {
      el.classList.toggle("flipped");
    }
    lastTap = now;
  });

  el.addEventListener("touchstart", e => {
    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;
  }, { passive: true });

  el.addEventListener("touchmove", e => {
    e.preventDefault();
  }, { passive: false });

  el.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      if (piles[pileIdx].showHidden) cycleHidden(pileIdx, dx < 0 ? 1 : -1);
      else dx < 0 ? doDefer(el, card, pileIdx) : doComplete(el, card, pileIdx);
    }
  });

  let mouseDown = false, mouseStartX = 0, mouseStartY = 0;
  el.addEventListener("mousedown", e => { mouseDown = true; mouseStartX = e.clientX; mouseStartY = e.clientY; });
  el.addEventListener("mouseup", e => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      if (piles[pileIdx].showHidden) cycleHidden(pileIdx, dx < 0 ? 1 : -1);
      else dx < 0 ? doDefer(el, card, pileIdx) : doComplete(el, card, pileIdx);
    }
  });
}

function cycleHidden(pileIdx, dir) {
  const arr = piles[pileIdx].hidden;
  if (arr.length <= 1) return;
  if (dir > 0) arr.push(arr.shift());
  else         arr.unshift(arr.pop());
  renderPiles();
}

function switchPile(dir) {
  const next = activePile + dir;
  if (next < 0 || next >= piles.length) return;
  activePile = next;
  renderPiles();
}

function shufflePile(pileIdx) {
  const arr = piles[pileIdx].cards;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  renderPiles();
}

function animateOut(el, direction, callback) {
  el.classList.add("swiping", direction === "left" ? "swipe-left" : "swipe-right");
  el.addEventListener("transitionend", callback, { once: true });
}

function doDefer(el, card, pileIdx) {
  animateOut(el, "left", () => {
    dismissed.push({ card, pileIdx, action: "defer" });
    piles[pileIdx].cards.shift();
    piles[pileIdx].deferred++;
    renderPiles();
    showUndo();
  });
}

async function doComplete(el, card, pileIdx) {
  animateOut(el, "right", async () => {
    const previousLastDone = card.lastDone;
    const newLastDone = previousLastDone ? `${previousLastDone}\n${todayMmDd()}` : todayMmDd();
    dismissed.push({ card, pileIdx, action: "complete", previousLastDone });
    piles[pileIdx].cards.shift();
    piles[pileIdx].done++;
    renderPiles();
    showUndo();
    await markComplete(card.dataIndex, newLastDone);
  });
}

// ── Complete Now dialog ───────────────────────────────────────────────────

let _confirmEl = null, _confirmCard = null, _confirmPileIdx = null;

function openConfirm(el, card, pileIdx) {
  _confirmEl = el; _confirmCard = card; _confirmPileIdx = pileIdx;
  document.getElementById("confirm-msg").textContent = `Mark "${card.title}" as completed today?`;
  document.getElementById("confirm-overlay").classList.add("visible");
}

function closeConfirm() {
  document.getElementById("confirm-overlay").classList.remove("visible");
  _confirmEl = _confirmCard = _confirmPileIdx = null;
}

async function confirmCompleteNow() {
  const el = _confirmEl, card = _confirmCard, pileIdx = _confirmPileIdx;
  closeConfirm();
  if (!el) return;
  el.classList.remove("flipped");
  await doComplete(el, card, pileIdx);
}

// ── Undo ──────────────────────────────────────────────────────────────────

let undoTimer = null; // kept for compatibility

function showUndo() {
  document.getElementById("undo-btn").style.display = "";
}

async function undo() {
  if (dismissed.length === 0) return;
  const last = dismissed.pop();
  piles[last.pileIdx].cards.unshift(last.card);
  if (last.action === "defer")    piles[last.pileIdx].deferred--;
  if (last.action === "complete") piles[last.pileIdx].done--;
  activePile = last.pileIdx;
  renderPiles();
  if (dismissed.length === 0) document.getElementById("undo-btn").style.display = "none";
  if (last.action === "complete") {
    await markComplete(last.card.dataIndex, last.previousLastDone);
  }
}

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { undo(); return; }
  if (e.key === "ArrowUp")    { switchPile(-1); return; }
  if (e.key === "ArrowDown")  { switchPile(1);  return; }
  if (e.key === " " && currentCard) { e.preventDefault(); currentCard.classList.toggle("flipped"); return; }
  if (e.key === "r") { shufflePile(activePile); return; }
  if (e.key === "ArrowLeft"  && currentCard) {
    if (piles[activePile]?.showHidden) cycleHidden(activePile, -1);
    else { const c = piles[activePile]?.cards[0]; if (c) doDefer(currentCard, c, activePile); }
  }
  if (e.key === "ArrowRight" && currentCard) {
    if (piles[activePile]?.showHidden) cycleHidden(activePile, 1);
    else { const c = piles[activePile]?.cards[0]; if (c) doComplete(currentCard, c, activePile); }
  }
});

// Page-level up/down swipe to switch piles
(function() {
  let pageStartX = 0, pageStartY = 0;
  document.addEventListener("touchstart", e => {
    pageStartX = e.changedTouches[0].clientX;
    pageStartY = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - pageStartX;
    const dy = e.changedTouches[0].clientY - pageStartY;
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60) {
      switchPile(dy < 0 ? -1 : 1);
    }
  }, { passive: true });
})();

// ── Boot ──────────────────────────────────────────────────────────────────
handleAuth();
</script>
</body>
